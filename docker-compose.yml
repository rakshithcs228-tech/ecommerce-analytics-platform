version: '3.9'

services:

  # ─────────────────────────────────────────────
  # ZOOKEEPER
  # ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    networks:
      - ecommerce-network


  # ─────────────────────────────────────────────
  # KAFKA
  # ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - ecommerce-network


  # ─────────────────────────────────────────────
  # KAFKA UI
  # ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    depends_on:
      - kafka

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    networks:
      - ecommerce-network


  # ─────────────────────────────────────────────
  # SPARK
  # ─────────────────────────────────────────────
  spark:
    image: apache/spark:3.4.0
    container_name: spark

    depends_on:
      - kafka

    ports:
      - "4040:4040"

    volumes:
      - ./spark:/opt/spark-apps
      - ./delta-lake:/opt/delta-lake

    command: tail -f /dev/null

    networks:
      - ecommerce-network


  # ─────────────────────────────────────────────
  # POSTGRES FOR HIVE METASTORE
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:13
    container_name: hive-postgres

    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - ecommerce-network


  # ─────────────────────────────────────────────
  # HIVE METASTORE
  # ─────────────────────────────────────────────
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore

    volumes:
      - ./hive:/opt/hive-scripts
      - ./delta-lake:/opt/delta-lake

    environment:
      SERVICE_NAME: metastore

    ports:
      - "9083:9083"

    command: >
      bash -c "
        mkdir -p /opt/delta-lake/hive-db &&
        chmod -R 777 /opt/delta-lake &&
        /opt/hive/bin/hive --service metastore
      "

    networks:
      - ecommerce-network


  # ─────────────────────────────────────────────
  # HIVE SERVER2
  # ─────────────────────────────────────────────
  hiveserver2:
    image: apache/hive:4.0.0
    container_name: hiveserver2

    volumes:
      - ./hive:/opt/hive-scripts
      - ./delta-lake:/opt/delta-lake

    depends_on:
      - hive-metastore

    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083

    ports:
      - "10000:10000"

    command: >
      bash -c "
        mkdir -p /opt/delta-lake/hive-db &&
        chmod -R 777 /opt/delta-lake &&
        /opt/hive/bin/hiveserver2
      "

    networks:
      - ecommerce-network


  # ─────────────────────────────────────────────
  # AIRFLOW
  # ─────────────────────────────────────────────
  airflow:
    image: apache/airflow:2.8.1
    container_name: airflow

    ports:
      - "8088:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin123

    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
        --username admin
        --password admin123
        --firstname admin
        --lastname admin
        --role Admin
        --email admin@example.com || true &&
        airflow webserver &
        airflow scheduler
      "

    volumes:
      - ./airflow/dags:/opt/airflow/dags

    networks:
      - ecommerce-network


# ─────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────
networks:
  ecommerce-network:
    driver: bridge


# ─────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────
volumes:
  postgres-data: